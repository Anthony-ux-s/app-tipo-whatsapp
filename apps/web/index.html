<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#009d71" />
    <meta name="description" content="Parla: chats cifrados de extremo a extremo y servicios con pago por QR y delivery." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Pantalla de arranque: el logo (sin fondo) se anima mientras carga la app; React la reemplaza al montar. */
      #boot-splash{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#f0f2f5}
      @media (prefers-color-scheme:dark){#boot-splash{background:#0b141a}}
      #boot-splash svg{width:84px;height:84px;animation:bs-bob 3.2s ease-in-out 1.4s infinite}
      #boot-splash .b1,#boot-splash .b2{transform-box:fill-box;opacity:0;animation:bs-pop .55s cubic-bezier(.34,1.4,.64,1) forwards}
      #boot-splash .b1{transform-origin:20% 80%;animation-delay:.05s}
      #boot-splash .b2{transform-origin:80% 20%;animation-delay:.25s}
      #boot-splash .tk{stroke-dasharray:1;stroke-dashoffset:1;animation:bs-draw .45s ease-out .7s forwards}
      @keyframes bs-pop{0%{opacity:0;transform:scale(.4)}70%{opacity:1;transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
      @keyframes bs-draw{to{stroke-dashoffset:0}}
      @keyframes bs-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
      @media (prefers-reduced-motion:reduce){#boot-splash *,#boot-splash svg{animation:none!important;opacity:1!important;stroke-dashoffset:0!important}}
    </style>
    <title>Parla — chats y servicios</title>
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"><div id="boot-splash" aria-hidden="true"><svg viewBox="0 0 48 48"><defs><mask id="bs-cut" maskUnits="userSpaceOnUse" x="0" y="0" width="48" height="48"><rect width="48" height="48" fill="#fff"/><path d="M11 15h16a8 8 0 0 1 8 8v10a8 8 0 0 1-8 8H17l-8 6v-6.4A8 8 0 0 1 3 33V23a8 8 0 0 1 8-8z" fill="#000" stroke="#000" stroke-width="5" stroke-linejoin="round"/></mask></defs><g mask="url(#bs-cut)"><path class="b1" d="M20 5h17a8 8 0 0 1 8 8v10a8 8 0 0 1-8 8h-1v6l-7-6h-9a8 8 0 0 1-8-8V13a8 8 0 0 1 8-8z" fill="#34d399"/></g><path class="b2" d="M11 15h16a8 8 0 0 1 8 8v10a8 8 0 0 1-8 8H17l-8 6v-6.4A8 8 0 0 1 3 33V23a8 8 0 0 1 8-8z" fill="#009d71"/><path class="tk" pathLength="1" d="M12.5 28.5l4.5 4.5 8.5-9" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
