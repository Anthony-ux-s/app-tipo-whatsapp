# Parla en un servidor propio: gateway (Go, único puerto público de la app) → core (NestJS) + tiempo
# real (Elixir) + APIs de servicios (simuladas en «providers»: tienda, delivery y billetera). La base de datos
# es PostgreSQL en Supabase (DATABASE_URL y DIRECT_URL del .env), no hay contenedor de base de datos.
#   cp .env.example .env   (y completa los valores: DATABASE_URL y DIRECT_URL de Supabase, secretos…)
#   docker compose up -d --build
# Caddy (incluido) publica el sitio con HTTPS automático en SITE_ADDRESS: la cámara, el micrófono, las
# notificaciones push y la PWA exigen HTTPS fuera de localhost.

services:
  # Puerta pública con HTTPS automático: abre 80 y 443 en el servidor y apunta tu dominio (DNS) a su IP.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [gateway]
    ports:
      - '80:80'
      - '443:443'
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Define SITE_ADDRESS (tu dominio, p. ej. kronito.com)}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  gateway:
    build: services/gateway
    restart: unless-stopped
    depends_on: [core, realtime, providers]
    ports:
      - '127.0.0.1:8080:4100' # solo local: lo público entra por Caddy (HTTPS)
    environment:
      APP_ENV: production
      CORE_URL: http://core:4101
      REALTIME_LINK_URL: ws://realtime:4102/link
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?Define INTERNAL_TOKEN (24+ caracteres)}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET (32+ caracteres)}
      WEB_ORIGIN: ${PUBLIC_URL}
      PROVIDERS_URL: http://providers:4103
      # Los avisos de pago viajan por la red interna de Docker
      GATEWAY_PUBLIC_URL: http://gateway:4100
      PAGAYA_WEBHOOK_SECRET: ${PAGAYA_WEBHOOK_SECRET:?Define PAGAYA_WEBHOOK_SECRET (24+ caracteres)}
      MERCAYA_ADMIN_KEY: ${MERCAYA_ADMIN_KEY:?Define MERCAYA_ADMIN_KEY (24+ caracteres)}
      PAGAYA_API_KEY: ${PAGAYA_API_KEY:?Define PAGAYA_API_KEY (24+ caracteres)}
      # Retiro automático diario de las ganancias de los repartidores (hora de Lima; vacío = apagado)
      RAPIDITO_PAYOUT_AT: ${RAPIDITO_PAYOUT_AT:-23:00}
      GATEWAY_RATE_PER_MINUTE: ${GATEWAY_RATE_PER_MINUTE:-600}

  # Simuladores de tienda (MercaYa), tarifa del delivery (Rapidito) y billetera con QR (PagaYa). Para producción
  # real se reemplazan por los proveedores verdaderos y solo cambian los traductores del gateway.
  providers:
    build: services/providers
    restart: unless-stopped
    ports:
      - '127.0.0.1:8081:4103' # solo local (simulador de la billetera)
    environment:
      PROVIDERS_PUBLIC_URL: ${PROVIDERS_PUBLIC_URL:-http://localhost:8081}
      PAGAYA_WEBHOOK_SECRET: ${PAGAYA_WEBHOOK_SECRET}
      MERCAYA_ADMIN_KEY: ${MERCAYA_ADMIN_KEY}
      PAGAYA_API_KEY: ${PAGAYA_API_KEY}
      TECNOYA_API_KEY: ${TECNOYA_API_KEY:-}

  realtime:
    build: services/realtime
    restart: unless-stopped
    environment:
      CORE_URL: http://core:4101
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}

  core:
    build: .
    restart: unless-stopped
    environment:
      REALTIME_URL: http://realtime:4102
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      # Supabase: DATABASE_URL por el pooler (6543, ?pgbouncer=true); DIRECT_URL directa (5432) para las migraciones
      DATABASE_URL: ${DATABASE_URL:?Define DATABASE_URL (Supabase, pooler 6543)}
      DIRECT_URL: ${DIRECT_URL:?Define DIRECT_URL (Supabase, conexión directa 5432)}
      # Primer administrador (se crea al arrancar si no existe)
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-Soporte}
      ADMIN_PHONE: ${ADMIN_PHONE:-}
      ROUTING_URL: ${ROUTING_URL:-https://router.project-osrm.org}
      APK_PACKAGE_ID: ${APK_PACKAGE_ID:-}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      APK_SHA256_CERT_FINGERPRINTS: ${APK_SHA256_CERT_FINGERPRINTS:-}
      STUN_URLS: ${STUN_URLS:-stun:stun.l.google.com:19302,stun:stun1.l.google.com:19302}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET (32+ caracteres)}
      PUBLIC_WEB_URL: ${PUBLIC_URL:?Define PUBLIC_URL, p. ej. https://chat.miempresa.com}
      WEB_ORIGIN: ${PUBLIC_URL}
      ONESIGNAL_APP_ID: ${ONESIGNAL_APP_ID:?Define ONESIGNAL_APP_ID (códigos por SMS y correo)}
      ONESIGNAL_API_KEY: ${ONESIGNAL_API_KEY:?Define ONESIGNAL_API_KEY}
      ONESIGNAL_SMS_FROM: ${ONESIGNAL_SMS_FROM:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:soporte@parla.app}
      TURN_URL: ${TURN_URL:-}
      TURN_USERNAME: ${TURN_USERNAME:-}
      TURN_CREDENTIAL: ${TURN_CREDENTIAL:-}
      # Ganancias del repartidor: % de la tarifa de delivery (Rapidito se queda con el resto) y mínimos
      DRIVER_SHARE_PERCENT: ${DRIVER_SHARE_PERCENT:-95}
      DRIVER_MIN_AUTO_PAYOUT_SOLES: ${DRIVER_MIN_AUTO_PAYOUT_SOLES:-5}
      DRIVER_MIN_MANUAL_PAYOUT_SOLES: ${DRIVER_MIN_MANUAL_PAYOUT_SOLES:-1}
      # Ofertas por cercanía: radios de cada oleada (km) y minutos entre oleadas
      DISPATCH_RADII_KM: ${DISPATCH_RADII_KM:-3,6,12}
      DISPATCH_WAVE_MINUTES: ${DISPATCH_WAVE_MINUTES:-2}
    volumes:
      - app-storage:/data/storage

volumes:
  app-storage:
  caddy-data:
  caddy-config:
